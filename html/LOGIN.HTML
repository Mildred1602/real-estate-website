<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/login.css">
    
</head>
<body>
    <div class="container">
        <div class="form-container" id="formContainer">
            <!-- Login Form -->
            <div class="form-panel">
                <div class="logo">
                    <h1>🏡 RealEstate</h1>
                    <p>Find Your Dream Home</p>
                </div>

                <h2>Welcome Back</h2>
                <p class="subtitle">Login to access your account</p>

                <form id="loginForm">
                    <div class="input-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" placeholder="Enter your email" required>
                    </div>

                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>

                    <div class="forgot-password">
                        <a href="#">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn">Login</button>
                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="social-login">
                    <button class="social-btn">Google</button>
                    <button class="social-btn">Facebook</button>
                </div>

                <div class="toggle-form">
                    Don't have an account? <a id="showRegister">Register now</a>
                </div>
            </div>

            <!-- Register Form -->
            <div class="form-panel">
                <div class="logo">
                    <h1>🏡 RealEstate</h1>
                    <p>Find Your Dream Home</p>
                </div>

                <h2>Create Account</h2>
                <p class="subtitle">Register to start your journey</p>

                <form id="registerForm">
                    <div class="input-group">
                        <label for="register-name">Full Name</label>
                        <input type="text" id="register-name" placeholder="Enter your full name" required>
                    </div>

                    <div class="input-group">
                        <label for="register-email">Email Address</label>
                        <input type="email" id="register-email" placeholder="Enter your email" required>
                    </div>

                    <div class="input-group">
                        <label for="register-phone">Phone Number</label>
                        <input type="tel" id="register-phone" placeholder="Enter your phone number" required>
                    </div>

                    <div class="input-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" placeholder="Create a password" required>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the Terms & Conditions</label>
                    </div>

                    <button type="submit" class="btn">Create Account</button>
                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="social-login">
                    <button class="social-btn">Google</button>
                    <button class="social-btn">Facebook</button>
                </div>

                <div class="toggle-form">
                    Already have an account? <a id="showLogin">Login here</a>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="../javascript/login.js"></script>
</html>
